# key = { fg = "#ffffff", bg = "#000000", underline = { color = "#ff0000", style = "curl"} }

"inherits" = "tokyonight"
"comment" = { fg = "comment" }
"diagnostic.hint" = { underline = { style = "none", color = "hint" } }
"diagnostic.info" = { underline = { style = "none", color = "info" } }
"diagnostic.warning" = { underline = { style = "none", color = "yellow" } }
"function" = { fg = "blue" }
"keyword" = { fg = "purple" }
"keyword.control.return" = { fg = "purple" }
"markup.italic" = {}
"punctuation.bracket" = { fg = "fg" }
"tag" = { fg = "green" }
"ui.cursorline.primary" = { bg = "bg-darker" }
"ui.help" = { bg = "bg", fg = "fg" }
"ui.linenr.selected" = { fg = "fg" }
"ui.popup" = { bg = "bg", fg = "border-highlight" }
"ui.text.inactive" = { fg = "comment" }
"variable.parameter" = { fg = "yellow" }

