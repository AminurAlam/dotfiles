[palette]
border = "#1d202f"
bg = "#24283b"
bg-inlay = "#233745"
bg-selection = "#2e3c64"
bg-menu = "#24283b"
bg-darker = "#1f2335"
bg-focus = "#2e3c64"
border-highlight = "#29a4bd"
