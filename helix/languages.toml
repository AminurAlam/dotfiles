# htps://github.com/helix-editor/helix/wiki/Language-Server-Configurations
# TODO: ini

[[grammar]]
name = "kanata"
source = { git = "https://codeberg.org/AminurAlam/tree-sitter-kanata", rev = "04a75edb2cb446d5863dadfac3dacceb2aa07de0" }

[[language]]
name = "fish"
auto-format = true
formatter = { command = "fish_indent" }

[[language]]
name = "kanata"
scope = "source.kanata"
file-types = ["kbd"]
comment-tokens = [";;"]

[[language]]
name = "lua"
auto-format = true
formatter = { command = "stylua", args = ["-f", "repos/dotfiles/other/stylua.toml", "-"] }

[[language]]
name = "python"
auto-format = true
language-servers = ["ruff", "ty"]

[[language]]
name = "toml"
auto-format = true
formatter = { command = "taplo", args = ["format", "-"] }

[[language]]
name = "typst"
scope = "source.typst"
file-types = ["typst", "typ"]
indent = { tab-width = 2, unit = "  " }
comment-token = "//"
injection-regex = "typ(st|c)?"
auto-pairs = { '(' = ')', '{' = '}', '[' = ']', '$' = '$', '"' = '"', '`' = '`' }
