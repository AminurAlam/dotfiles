theme = "custom"

[keys.normal]
# TODO: use C-o to move back instead of gx
# symbol
"$" = "extend_to_line_end"
"+" = "increment"
"-" = "decrement"
"^" = "extend_to_first_nonwhitespace"
"[".h = "goto_prev_change"
"]".h = "goto_next_change"
"{" = "goto_prev_paragraph"
"}" = "goto_next_paragraph"
# modifier and special
"C-n" = "expand_selection"
"C-p" = "shrink_selection"
"C-j" = ":buffer-next"
"C-k" = ":buffer-previous"
"C-r" = ":config-reload"
"C-v" = "copy_selection_on_next_line"
"C-ret" = "@miW"
"esc" = ["collapse_selection", "keep_primary_selection"]
"ret" = "@miw*"
"S-ret" = "@miW"
# main
0 = "extend_to_line_start"
C = ["collapse_selection", "extend_to_line_end", "change_selection"]
D = ["collapse_selection", "extend_to_line_end", "delete_selection"]
G = "goto_file_end"
M = "match_brackets"
U = ":reset-diff-change"
V = ["select_mode", "extend_to_line_bounds"]
X = "select_line_above"
Y = ["collapse_selection", "extend_to_line_end", "yank", "flip_selections"]
g.h = "extend_to_line_start"
g.l = "extend_to_line_end"
g.x = "goto_file"
q = [":noop %sh{hx-state save %{buffer_name} %{cursor_line} %{cursor_column}}", ":quit"]
r = "redo"
x = "select_line_below"
z.d = ":toggle-option inline-diagnostics.cursor-line warning disable"
z.f = ":toggle-option auto-format"
z.n = [':toggle-option gutters.layout [] "diff", "line-numbers", "spacer"']
z.w = ":toggle-option soft-wrap.enable"
z.x = [":goto %sh{hx-state load %{buffer_name} 1} %sh{hx-state load %{buffer_name} 2}", "align_view_center"]

[keys.normal.m]
# TODO: html tag stuff
m = "@mim"
M = "@mam"
c = "surround_replace"
'"' = '@mi"'
"'" = "@mi'"
"`" = "@mi`"
"[" = "@mi["
"]" = "@mi]"
"(" = "@mi("
")" = "@mi)"
"{" = "@mi{"
"}" = "@mi}"

[keys.normal."@"]
"@" = "replay_macro"
# template = "@<C-s><esc><C-o>"
f = '@<C-s>ma"if<esc><C-o>'
m = "@<C-s>A;<esc><C-o>"
x = "@<C-s>geT[cx<esc><C-o>"

[keys.normal.space]
F = "file_picker_in_current_buffer_directory"
e = [":w", ":sh out %{file_path_absolute}"]
g = "global_search"
h = "command_palette"
w = ":w"

### INSERT
[keys.insert]
"C-n" = "completion"
"C-j" = ":buffer-next"
"C-k" = ":buffer-previous"
"C-left" = "move_prev_word_start"
"C-right" = "move_next_word_start"

### SELECT
[keys.select]
# symbol
"$" = "extend_to_line_end"
"+" = "increment"
"-" = "decrement"
"[".h = "goto_prev_change"
"]".h = "goto_next_change"
"^" = "extend_to_first_nonwhitespace"
"{" = "goto_prev_paragraph"
"}" = "goto_next_paragraph"
# main
0 = "extend_to_line_start"
G = "extend_to_file_end"
M = "match_brackets"
U = ":reset-diff-change"
X = "select_line_above"
g.x = "goto_file"
o = "flip_selections"
x = "select_line_below"

[keys.select.m]
m = "@mim"
M = "@mam"
c = "surround_replace"
'"' = '@mi"'
"'" = "@mi'"
"`" = "@mi`"
"[" = "@mi["
"]" = "@mi]"
"(" = "@mi("
")" = "@mi)"
"{" = "@mi{"
"}" = "@mi}"
