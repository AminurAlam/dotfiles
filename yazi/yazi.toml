# :schema /home/fisher/repos/yazi-schemas/schemas/yazi.json
#:schema https://yazi-rs.github.io/schemas/yazi.json

## FETCH
[plugin]
fetchers = [
  { group = "mime", prio = "high", url = "*/", run = "mime.dir" },
  { group = "mime", prio = "high", url = "local://*", run = "mime-ext.local" },
  { group = "mime", prio = "high", url = "remote://*", run = "mime-ext.remote" },
  { group = "mime", prio = "high", url = "trash://*", run = "mime.trash" },
  { group = "mime", prio = "high", url = "*.{!qB,part}", run = "noop" },
  { group = "mime", prio = "high", url = "/mnt/rclone/**", run = "noop" },
  { group = "git", url = "*", run = "git" },
  { group = "git", url = "*/", run = "git" },
]
prepend_previewers = [
  # partial downloads
  { url = "*.{!qB,part}", run = "noop" },
  { url = "/mnt/rclone/**", run = "noop" },
  # custom plugins
  { url = "**/.git/", run = "preview-git" },
  { url = "**/manga/**/*.{zip,rar}", run = "preview-cbz" },
  { url = "**/smut/*.{zip,rar}", run = "preview-cbz" },
  { url = "*.typ", run = "preview-typst" },
  { url = "*.service", run = "preview-systemd" },
  { mime = "application/apple.mpegurl", run = "code" },
  { mime = "application/bittorrent", run = "preview-torrent" },
  { mime = "application/cbr", run = "preview-cbz" },
  { mime = "application/sqlite3", run = "preview-sqlite" },
  { mime = "audio/mpegurl", run = "code" },
  { mime = "audio/*", run = "preview-audio" },
  { mime = "font/*", run = "font-sample" },
]
prepend_preloaders = [
  # partial downloads
  { url = "*.{!qB,part}", run = "noop" },
  { url = "/mnt/rclone/**", run = "noop" },
  # custom plugins
  { url = "**/manga/**/*.{zip,rar}", run = "preview-cbz" },
  { url = "**/smut/*.{zip,rar}", run = "preview-cbz" },
  { url = "*.typ", run = "preview-typst" },
  { mime = "application/cbr", run = "preview-cbz" },
  { mime = "audio/*", run = "preview-audio" },
  { mime = "font/*", run = "font-sample" },
]
spotters = [
  { mime = "multi/*", run = "multi" },
  { mime = "folder/*", run = "spot" },
  { mime = "application/cbr", run = "spot-cbz" },
  { mime = "audio/*", run = "spot-audio" },
  { mime = "image/*", run = "spot-image" },
  { mime = "video/*", run = "spot-video" },
  { url = "*", run = "spot" },
]

## OPEN
[open]
rules = [
  { mime = "folder/*", use = ["dir", "common"] },
  { url = "bulk-rename.txt", use = "bulk-rename" },
  # archives
  { mime = "application/cbr", use = ["okular", "extract", "common"] },
  { mime = "application/android.package-archive", use = ["apkinstall", "extract", "common"] },
  { mime = "application/{zip,rar}", use = ["extract", "okular", "common"] },
  {
    mime = "application/{7z*,tar,gzip,xz,zstd,bzip*,lzma,debian-package,compress,archive,cpio,arj,xar,ms-cab*}",
    use = ["extract", "common"]
  },
  # multimedia
  { url = "*.{ass,srt,ssa,sup,vtt}", use = ["add-sub", "edit", "common"] },
  { mime = "application/pdf", use = ["okular", "common"] },
  { mime = "application/bittorrent", use = ["torrent", "open", "common"] },
  { mime = "audio/mpegurl", use = ["edit", "common"] },
  { mime = "image/svg+xml", use = ["swayimg", "inkscape", "edit", "common"] },
  { mime = "image/*", use = ["swayimg", "raster_tools", "png2jpg", "common"] },
  { mime = "video/*", use = ["play", "common"] },
  { mime = "audio/*", use = ["play", "audio_tools", "common"] },
  # text
  { mime = "text/*", use = ["edit", "common"] },
  { mime = "inode/empty", use = ["edit", "common"] },
  { mime = "application/{json,ndjson}", use = ["edit", "common"] },
  { mime = "*/javascript", use = ["edit", "common"] },
  # other
  { mime = "trash/**", use = ["open", "trash"] },
  { url = "*", use = ["open", "common"] },
]

[opener]
add-sub = [
  { run = ''' printf "sub-add '%%s'\n" %s1 | socat - /tmp/mpv.sock ''', desc = "󰨗 Add sub to MPV", for = "linux" },
]
apkinstall = [
  {
    run = "ANDROID_USER_HOME=/home/fisher/.local/share/.android HOME=/home/fisher/.local/share/ adb install %s",
    block = true,
    orphan = false,
    desc = " apk installer",
    for = "linux"
  },
]
bulk-rename = [{ run = "$EDITOR %s; ya exec bulk_exit %s --accept", block = true }]
extract = [{ run = 'ya pub extract --list %s""', desc = "󱉛 Extract here", for = "unix" }]
inkscape = [{ run = "LANG=en_US.utf-8 inkscape %s", block = false, orphan = true, desc = "󰕞 inkscape", for = "linux" }]
okular = [{ run = "LANG=en_US.utf-8 okular %s", block = false, orphan = true, desc = " okular", for = "linux" }]
open = [{ run = "xdg-open %s1", orphan = true, desc = "󰏌 Open", for = "linux" }]
play = [{ run = "mpv --force-window %s", orphan = true, desc = " mpv", for = "linux" }]
png2jpg = [{ run = "magick %s1 JPG:%s1.jpg", desc = "󰧸 png -> jpg", for = "linux" }]
swayimg = [{ run = "swayimg %s", block = false, orphan = true, desc = " swayimg", for = "linux" }]
torrent = [{ run = ''' foot -- fish -c "at %s" ''', block = false, orphan = true, desc = " aria2c torrent" }]
trash = [
  { run = "ya pub trash-restore --list %S", desc = "Restore selected files" },
  { run = "ya pub trash-empty --list %S", desc = "Empty trash bin" },
]
zathura = [{ run = "zathura %s", block = false, orphan = true, desc = " zathura", for = "linux" }]
# groups
raster_tools = [
  { run = "ctl wp %s1", block = false, orphan = true, desc = " swaybg", for = "linux" },
  {
    run = "LANG=en_US.utf-8 krita --fullscreen %s",
    block = false,
    orphan = true,
    desc = " krita",
    for = "linux"
  },
  { run = "identity -d row -- %s", orphan = true, desc = "󰆊 compare images", for = "linux" },
]
audio_tools = [
  { run = "kid3-qt -- %s", orphan = true, desc = " kid3", for = "linux" },
  { run = "picard -- %s", orphan = true, desc = "󰫅 picard", for = "linux" },
  { run = "tenacity %s", block = false, orphan = true, desc = "󰓀 tenacity", for = "linux" },
]
edit = [
  { run = "hx %s", desc = "󰚄 hx", block = true, for = "unix" },
  { run = "nvim %s", desc = " nvim", block = true, for = "unix" },
]
common = [
  # { run = "dragon-drop -x %s", orphan = true, desc = " Drag and Drop", for = "linux" },
  {
    run = "rsync -Pha --info PROGRESS2 -- %s brick:/sdcard/Download/",
    block = false,
    desc = " Send to brick",
    for = "linux"
  },
  { run = "termux-open %s1", orphan = true, desc = "󰏌 Open", for = "android" },
]
dir = [
  # { run = "xdg-open %d", desc = " Reveal", for = "linux" },
  { run = "swayimg -g %s", orphan = true, desc = " gallery", for = "linux" },
  { run = "fish -c 'dir2cbz $argv' %s", block = true, desc = " dir2cbz" },
]

[mgr]
ratio = [0, 1, 1]
sort_by = "extension"
sort_fallback = "natural"
linemode = "size"
show_hidden = true
scrolloff = 10

[preview]
max_width = 1500
max_height = 1007

[input]
# TODO: no border
# rename
rename_title = ""
rename_origin = "hovered"
rename_offset = [2, -1, 77, 3]

# find
find_title = [" / ", " ? "]
find_origin = "bottom-left"

[pick]
open_offset = [0, 1, 50, 999]

[tasks]
image_bound = [20000, 20000]
